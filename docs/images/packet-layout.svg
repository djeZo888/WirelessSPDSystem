<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc">
<title id="title">20-byte beacon frame</title>
<desc id="desc">Byte 0 packs hardware and firmware nibbles. Byte 1 packs a 7-bit beacon ID and the OK bit. Byte 2 is signed Celsius. Bytes 3 to 10 are a little-endian 64-bit nonce. Byte 11 is encoded cell voltage. Bytes 12 to 19 are the first 8 bytes of SHA-256 over bytes 0 to 11 followed by the 4-byte little-endian secret.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#51687b"/></marker></defs>
<style>text {font-family:Arial,Helvetica,sans-serif} .mono {font-family:Consolas,Menlo,monospace}</style>
<rect width="1280" height="630" fill="#fff"/>
<text x="56" y="57" font-size="34" fill="#16324a" text-anchor="start" font-weight="700">20-byte beacon frame</text>
<text x="56" y="95" font-size="20" fill="#51687b" text-anchor="start">Application bytes only · little-endian integers · telemetry is unencrypted</text>
