<rect x="231.2" y="161" width="467.2" height="78" rx="0" fill="#e5edf5" stroke="#fff"/>
<text x="464.8" y="206" font-size="22" fill="#16324a" text-anchor="middle" font-weight="700">64-bit nonce · LE</text>
<rect x="698.4" y="161" width="58.4" height="78" rx="0" fill="#f3e9d5" stroke="#fff"/>
<text x="727.6" y="206" font-size="14" fill="#8a6323" text-anchor="middle" font-weight="700">Vbat</text>
<rect x="756.8" y="161" width="467.2" height="78" rx="0" fill="#dcefe8" stroke="#fff"/>
<text x="990.4" y="206" font-size="22" fill="#247562" text-anchor="middle" font-weight="700">Authentication tag · 8 bytes</text>
<path d="M56 250 L56 260 L756.8 260 L756.8 250" stroke="#166a94" stroke-width="2" fill="none"/>
<text x="406.4" y="286" font-size="19" fill="#166a94" text-anchor="middle" font-weight="700">Authenticated data · bytes 0-11</text>
<path d="M756.8 250 L756.8 260 L1224 260 L1224 250" stroke="#247562" stroke-width="2" fill="none"/>
<text x="990.4" y="286" font-size="19" fill="#247562" text-anchor="middle" font-weight="700">Tag · bytes 12-19</text>
<rect x="56" y="315" width="700" height="242" rx="14" fill="#f2f6f9" stroke="#d7e2eb"/>
<text x="80" y="353" font-size="23" fill="#16324a" text-anchor="start" font-weight="700">Compact field encoding</text>
<text x="80" y="391" font-size="18" fill="#16324a" text-anchor="start">Byte 0    bits 7-4: hardware · bits 3-0: firmware</text>
<text x="80" y="422" font-size="18" fill="#16324a" text-anchor="start">Byte 1    bits 7-1: ID 1-127 · bit 0: 1=OK, 0=FAIL</text>
<text x="80" y="453" font-size="18" fill="#16324a" text-anchor="start">Byte 2    signed int8 °C (faults: -128 / -127 / -126)</text>
<text x="80" y="484" font-size="18" fill="#16324a" text-anchor="start">Byte 11   voltage = 2.20 V + code × 0.01 V</text>
<text x="80" y="515" font-size="18" fill="#16324a" text-anchor="start">                 0-150 valid · 255 unavailable / error</text>
<rect x="790" y="315" width="434" height="242" rx="14" fill="#edf6f2" stroke="#c2ded5"/>
<text x="814" y="353" font-size="23" fill="#247562" text-anchor="start" font-weight="700">Keyed hash calculation</text>
<text x="814" y="397" font-size="18" fill="#16324a" text-anchor="start" class="mono">SHA-256(</text>
<text x="814" y="428" font-size="18" fill="#16324a" text-anchor="start" class="mono">  data[0..11] || SECRET_LE32</text>
<text x="814" y="459" font-size="18" fill="#16324a" text-anchor="start" class="mono">)[0..7]</text>
<text x="814" y="524" font-size="19" fill="#247562" text-anchor="start">The secret is never transmitted.</text>
<text x="56" y="595" font-size="18" fill="#51687b" text-anchor="start">Compatible format: SHA-256 suffix construction, 32-bit key, 64-bit tag. See protocol.md for limits.</text>
</svg>
