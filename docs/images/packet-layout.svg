<text x="85.2" y="206" font-size="12" fill="#166a94" text-anchor="middle" font-weight="700">HW/FW</text>
<rect x="114.4" y="161" width="58.4" height="78" rx="0" fill="#e5f2ec" stroke="#fff"/>
<text x="143.6" y="206" font-size="13" fill="#247562" text-anchor="middle" font-weight="700">ID/OK</text>
<rect x="172.8" y="161" width="58.4" height="78" rx="0" fill="#f3e9d5" stroke="#fff"/>
