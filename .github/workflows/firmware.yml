name: Firmware builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [acdc, battery, server]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install pinned dependencies
        run: python3 tools/firmware.py setup ${{ matrix.target }}
      - name: Compile with synthetic configuration
        run: python3 tools/firmware.py validate ${{ matrix.target }}
      - name: Check repository hygiene
        run: python3 tools/check_repository.py
      - name: Check packet compatibility
        if: matrix.target == 'acdc'
        run: python3 tests/check_packet_compatibility.py
      - name: Check AC-DC sleep scheduling and peripheral shutdown
        if: matrix.target == 'acdc'
        run: python3 tests/check_acdc_sleep.py
      - name: Check server display paging
        if: matrix.target == 'server'
        run: python3 tests/check_server_display.py
      - name: Check complete server API and web list
        if: matrix.target == 'server'
        run: python3 tests/check_server_api.py
      - name: Check persistent nonce and interrupted EEPROM writes
        if: matrix.target == 'acdc'
        run: python3 tests/check_persistent_nonce.py
      - name: Check EEPROM retention and BOD preparation before flash
        if: matrix.target == 'acdc'
        run: python3 tests/check_nonce_flash_fuses.py
      - name: Check radio and configuration boundaries
        if: matrix.target == 'acdc'
        run: python3 tests/check_radio_configuration.py
      - name: Check responsive dashboard and update UI
        if: matrix.target == 'server'
        run: python3 tests/check_server_dashboard.py
      - name: Check session log buffer and timestamps
        if: matrix.target == 'server'
        run: python3 tests/check_server_logs.py
      - name: Check authenticated OTA lifecycle
        if: matrix.target == 'server'
        run: python3 tests/check_server_ota.py
      - name: Check MQTT discovery and telemetry
        if: matrix.target == 'server'
        run: python3 tests/check_server_mqtt.py
